<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CFC · Opening App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
      text-align: center;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div>
    <div>Opening application…</div>
    <div style="margin-top:8px;font-size:13px">
      If it doesn’t open,
      <a id="lnk" href="#">tap here</a>
    </div>
  </div>

  <script>
    const url =
      "https://script.google.com/macros/s/AKfycbyswakgzLd_4T-Pk6-r27NuDDR9Kwhm1d4DSHVYJDecNJ2SCOZH5Ef9e29WYnuMbES-YQ/exec";

    const link = document.getElementById("lnk");
    link.href = url;

    // slight delay prevents mobile/browser blocking
    setTimeout(() => {
      window.location.replace(url);
    }, 300);
  </script>

</body>
</html>
