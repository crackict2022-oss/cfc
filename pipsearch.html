<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resizable Dual HTML Viewer</title>
<style>
  html, body {
    margin: 0; 
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* Flex container */
  .container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  iframe {
    border: none;
    height: 100%;
  }

  /* Resizer bar */
  .resizer {
    width: 6px;
    background: #ccc;
    cursor: col-resize;
    position: relative;
    z-index: 1;
  }

  .resizer:hover {
    background: #999;
  }

  /* Responsive: stack vertically on small screens */
  @media (max-width: 800px) {
    .container {
      flex-direction: column;
    }
    .resizer {
      cursor: row-resize;
      width: 100%;
      height: 6px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <iframe src="https://sites.google.com/view/cfcmms/selfsearch" id="iframe1"></iframe>
  <div class="resizer" id="resizer"></div>
  <iframe src="https://script.google.com/macros/s/AKfycbwwAmYvpcbxpMkd-of7VfjAvC29Qlj3mCpPrfAsYBZ-du-aV6_OsdXm3Ubtk8jB0cMI/exec" id="iframe2"></iframe>
</div>

<script>
const resizer = document.getElementById('resizer');
const left = document.getElementById('iframe2');
const right = document.getElementById('iframe1');
const container = document.querySelector('.container');

let isResizing = false;

// Mouse events
resizer.addEventListener('mousedown', (e) => {
  isResizing = true;
  document.body.style.cursor = getComputedStyle(resizer).cursor;
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;

  const containerRect = container.getBoundingClientRect();

  if (window.innerWidth > 800) {
    // Horizontal resize
    let leftWidth = e.clientX - containerRect.left;
    let rightWidth = containerRect.width - leftWidth - resizer.offsetWidth;

    if (leftWidth < 50) leftWidth = 50;
    if (rightWidth < 50) rightWidth = 50;

    left.style.flex = '0 0 ' + leftWidth + 'px';
    right.style.flex = '0 0 ' + rightWidth + 'px';
  } else {
    // Vertical resize on small screens
    let topHeight = e.clientY - containerRect.top;
    let bottomHeight = containerRect.height - topHeight - resizer.offsetHeight;

    if (topHeight < 50) topHeight = 50;
    if (bottomHeight < 50) bottomHeight = 50;

    left.style.flex = '0 0 ' + topHeight + 'px';
    right.style.flex = '0 0 ' + bottomHeight + 'px';
  }
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = 'default';
  }
});
</script>

</body>
</html>
