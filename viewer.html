<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CFC Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}

header{
  background:#1f2937;
  color:#fff;
  padding:10px 14px;
  font-size:15px;
}

iframe{
  width:100%;
  height:calc(100vh - 44px);
  border:none;
  background:white;
}

#error{
  padding:20px;
  color:#b91c1c;
  font-size:14px;
}
</style>
</head>

<body>

<header>CFC Viewer</header>

<div id="error"></div>
<iframe id="frame"></iframe>

<script>
/* 🔢 SCRIPT MAP */
const SCRIPTS = {
  1: "https://script.google.com/macros/s/AKfycbyiOL9DTwOfnf39DPWJEAQCQMJguNQ5A-rRb1IZvBDAD3rdTaR_HbAS1B54fmfRNcInfw/exec",
  2: "https://script.google.com/macros/s/AKfycbxJ0ThopoJmNwM0yzAKFuBkRc3qFup3_w_9b1wt35kh5pooCOIfk5hvBcXq8896EDlp/exec",
  3: "https://script.google.com/macros/s/AKfycbxJ0ThopoJmNwM0yzAKFuBkRc3qFup3_w_9b1wt35kh5pooCOIfk5hvBcXq8896EDlp/exec",
  4: "https://script.google.com/macros/s/AKfycbxJ0ThopoJmNwM0yzAKFuBkRc3qFup3_w_9b1wt35kh5pooCOIfk5hvBcXq8896EDlp/exec"
};

const params = new URLSearchParams(window.location.search);
const id = params.get("script");

const frame = document.getElementById("frame");
const error = document.getElementById("error");

if (!id || !SCRIPTS[id]) {
  error.textContent = "Invalid or missing script number.";
} else {
  const url = SCRIPTS[id];

  // 🚫 Apps Script cannot be iframed
  if (url.includes("script.google.com")) {
    window.location.replace(url);
  } else {
    frame.src = url;
  }
}
</script>

</body>
</html>
